name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [api, web]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for package.json
        id: check
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No package.json in ${{ matrix.package }} yet, skipping."; fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20

      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: npm ci || npm install

      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: npm run build --if-present

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for web app
        id: check
        run: |
          if [ -f web/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No web app yet, skipping UI tests."; fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20

      - name: Install and build web
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: |
          npm ci || npm install
          npm run build

      - name: Install e2e
        if: steps.check.outputs.exists == 'true'
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: UI tests
        if: steps.check.outputs.exists == 'true'
        working-directory: e2e
        run: npm test

      - name: UI test pass rate
        if: always() && steps.check.outputs.exists == 'true'
        working-directory: e2e
        run: npm run pass-rate

      - name: Upload report
        if: always() && steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/results/
            e2e/playwright-report/
