name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [api, web]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for package.json
        id: check
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No package.json in ${{ matrix.package }} yet, skipping."; fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20

      # The API's Postgres store is tested against a real database. pg_stat_statements
      # is preloaded so the slowest-queries step below has data (metric xiv).
      - name: Start Postgres
        if: matrix.package == 'api'
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=lockedin_test \
            postgres:16 -c shared_preload_libraries=pg_stat_statements
          # The image's first-run setup uses a socket-only server, so TCP answering means the real one is up.
          for i in $(seq 1 60); do docker exec pg pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
          echo "TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/lockedin_test" >> "$GITHUB_ENV"

      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: npm ci || npm install

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: npm test --if-present

      - name: Slowest queries from the test run
        if: matrix.package == 'api'
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run db:slowest -- --limit 5

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: npm run build --if-present

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require web app
        id: check
        run: |
          test -f web/package.json || { echo "Web app missing. Merge the frontend before running UI tests."; exit 1; }
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20

      - name: Install and build web
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: ""
        run: |
          npm ci || npm install
          npm run build

      - name: Install e2e
        if: steps.check.outputs.exists == 'true'
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: UI tests
        if: steps.check.outputs.exists == 'true'
        working-directory: e2e
        run: npm test

      - name: UI test pass rate
        if: always() && steps.check.outputs.exists == 'true'
        working-directory: e2e
        run: npm run pass-rate

      - name: Upload report
        if: always() && steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/results/
            e2e/playwright-report/
