name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [api, web, e2e]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for package.json
        id: check
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No package.json in ${{ matrix.package }} yet, skipping."; fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20

      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: npm ci || npm install

      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: npm run build --if-present
