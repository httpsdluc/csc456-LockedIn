name: Production heartbeat

on:
  schedule:
    # Twice an hour, offset from the busiest minute. GitHub schedules use UTC.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-heartbeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check production dashboard and measure readiness
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          HEARTBEAT_EXPECTED_MODE: ${{ vars.HEARTBEAT_EXPECTED_MODE }}
          HEARTBEAT_TIMEOUT_MS: ${{ vars.HEARTBEAT_TIMEOUT_MS || '30000' }}
        run: npm run test:heartbeat
